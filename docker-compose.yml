services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: copilot_training
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
    ports:
      - "5433:5432"
    volumes:
      - copilot_training_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d copilot_training"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  copilot_training_pg:
